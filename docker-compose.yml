services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reforge-network

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      DEFAULT_NAMESPACE: default
      LOG_LEVEL: warn
    ports:
      - "7233:7233"
    networks:
      - reforge-network

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - reforge-network

  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reforge-network

  createbuckets:
    image: rustfs/rustfs:1.0.4
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_USER: ${MINIO_ROOT_USER:-minioadmin}
      S3_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        s3() { curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 --user \"$$S3_USER:$$S3_PASSWORD\" -X PUT \"$$@\"; } &&
        code=$$(s3 http://storage:9000/fraud-detection) &&
        { [ \"$$code\" = 200 ] || [ \"$$code\" = 409 ] || { echo \"Bucket creation failed: HTTP $$code\"; exit 1; }; } &&
        for prefix in raw-transactions training-data models/active models/archive reports/drift; do
          code=$$(s3 --data-binary keep http://storage:9000/fraud-detection/$$prefix/.keep) &&
          { [ \"$$code\" = 200 ] || { echo \"Creating $$prefix failed: HTTP $$code\"; exit 1; }; };
        done &&
        echo 'Storage bucket and folder structure ready.'
      "
    networks:
      - reforge-network

  python-ml:
    build: ./python-ml
    ports:
      - "8000:8000"
    environment:
      MINIO_HOST: storage
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: fraud-detection
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_TASK_QUEUE: ml-tasks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      storage:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    networks:
      - reforge-network

  nestjs-api:
    build: ./nestjs-api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reforge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      python-ml:
        condition: service_healthy
    networks:
      - reforge-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      nestjs-api:
        condition: service_healthy
    networks:
      - reforge-network

volumes:
  postgres_data:
  storage_data:

networks:
  reforge-network:
    driver: bridge
